<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#10131a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Playground" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="stylesheet" href="shared/style.css" />
    <title>Playground</title>
    <style>
      /* The launcher scrolls, unlike the games. */
      body {
        overflow-y: auto;
      }

      .app {
        position: static;
        height: auto;
        min-height: 100dvh;
      }

      header {
        padding: 28px 20px 16px;
      }

      header h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: -0.02em;
      }

      header p {
        margin: 6px 0 0;
        color: var(--fg-dim);
        font-size: 15px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 4px 16px 32px;
      }

      .tile {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 16px 14px 18px;
        min-height: 150px;
        border-radius: var(--radius);
        background: var(--bg-raised);
        color: inherit;
        text-decoration: none;
      }

      .tile:active {
        transform: scale(0.98);
      }

      .tile .icon {
        font-size: 34px;
        line-height: 1.1;
      }

      .tile .name {
        font-size: 17px;
        font-weight: 600;
      }

      .tile .blurb {
        font-size: 13px;
        line-height: 1.4;
        color: var(--fg-dim);
      }

      .empty {
        grid-column: 1 / -1;
        padding: 32px 8px;
        text-align: center;
        color: var(--fg-dim);
        line-height: 1.6;
      }

      /* PR builds: a Home Screen app has no URL bar, so switching lives here. */
      .builds {
        padding: 0 16px 24px;
      }

      .builds h2 {
        margin: 0 4px 8px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--fg-dim);
      }

      .build {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        margin-bottom: 8px;
        padding: 10px 14px;
        border-radius: var(--radius);
        background: var(--bg-raised);
        color: inherit;
        text-decoration: none;
      }

      .build .num {
        flex: none;
        min-width: 44px;
        font-weight: 700;
        color: var(--accent-2);
      }

      .build .title {
        flex: 1;
        font-size: 15px;
        line-height: 1.35;
      }

      .build.current {
        outline: 2px solid var(--accent);
      }

      .build.current::after {
        content: "here";
        font-size: 12px;
        color: var(--accent);
      }

      .preview-banner {
        display: none;
        margin: 0 16px 12px;
        padding: 10px 14px;
        border-radius: var(--radius);
        background: #3b2f12;
        color: #fcd34d;
        font-size: 14px;
        line-height: 1.4;
      }

      footer {
        padding: 0 20px 32px;
        color: var(--fg-dim);
        font-size: 13px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Playground</h1>
        <p>Small games, one thumb, portrait only.</p>
      </header>
      <div class="preview-banner" id="preview-banner"></div>
      <main class="grid" id="grid"></main>
      <section class="builds" id="builds" hidden>
        <h2>Builds</h2>
        <div id="build-list"></div>
      </section>
      <footer>Add to Home Screen for fullscreen play.</footer>
    </div>

    <script type="module">
      import { GAMES } from "./games.js";

      const grid = document.getElementById("grid");

      if (GAMES.length === 0) {
        grid.innerHTML = `<div class="empty">No games yet.<br />Run <code>scripts/new-game.sh</code> to add one.</div>`;
      } else {
        for (const game of GAMES) {
          const a = document.createElement("a");
          a.className = "tile";
          a.href = `games/${game.id}/index.html`;
          a.innerHTML = `
            <div class="icon">${game.icon ?? "🎮"}</div>
            <div class="name"></div>
            <div class="blurb"></div>`;
          a.querySelector(".name").textContent = game.title;
          a.querySelector(".blurb").textContent = game.blurb ?? "";
          grid.appendChild(a);
        }
      }

      // Every open PR is deployed at <root>/pr/<n>/ (scripts/build-pages.sh).
      // Work out the site root from wherever this launcher is served, so the
      // same file works on main and inside a preview.
      const here = location.pathname.match(/^(.*\/)pr\/(\d+)\//);
      const root = here ? here[1] : location.pathname.replace(/[^/]*$/, "");
      const currentPr = here ? Number(here[2]) : null;

      if (currentPr) {
        const banner = document.getElementById("preview-banner");
        banner.style.display = "block";
        banner.textContent = `Test build: PR #${currentPr}. Saves here are separate from main.`;
      }

      fetch(`${root}pr/index.json`, { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : []))
        .catch(() => [])
        .then((prs) => {
          // Nothing to switch to on main with no PRs open: stay out of the way.
          if (prs.length === 0 && !currentPr) return;
          const list = document.getElementById("build-list");
          const row = (href, num, title, current) => {
            const a = document.createElement("a");
            a.className = "build" + (current ? " current" : "");
            a.href = href;
            a.innerHTML = `<span class="num"></span><span class="title"></span>`;
            a.querySelector(".num").textContent = num;
            a.querySelector(".title").textContent = title;
            list.appendChild(a);
          };
          row(`${root}index.html`, "main", "The released version", !currentPr);
          for (const pr of prs) {
            row(
              `${root}pr/${pr.number}/index.html`,
              `#${pr.number}`,
              pr.title,
              pr.number === currentPr,
            );
          }
          if (currentPr && !prs.some((pr) => pr.number === currentPr)) {
            row(location.href, `#${currentPr}`, "This PR is closed and will disappear", true);
          }
          document.getElementById("builds").hidden = false;
        });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {
          /* offline support is a nice-to-have */
        });
      }
    </script>
  </body>
</html>
